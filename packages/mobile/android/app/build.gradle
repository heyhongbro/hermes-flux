apply plugin: 'com.android.application'

def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { stream ->
        keystoreProps.load(stream)
    }
}
def releaseStorePath = keystoreProps.getProperty('storeFile') ?: System.getenv('ANDROID_KEYSTORE_PATH')
def releaseStorePassword = keystoreProps.getProperty('storePassword') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = keystoreProps.getProperty('keyAlias') ?: System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = keystoreProps.getProperty('keyPassword') ?: System.getenv('ANDROID_KEY_PASSWORD')
def resolvedStoreFile = releaseStorePath
    ? (new File(releaseStorePath).isAbsolute() ? file(releaseStorePath) : rootProject.file(releaseStorePath))
    : null
def hasReleaseKeystore = resolvedStoreFile != null && resolvedStoreFile.exists() && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace = "com.hermesflux.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hermesflux.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile resolvedStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }
    buildTypes {
        release {
            def requireReleaseSigning = [
                project.findProperty('requireReleaseSigning')?.toString(),
                System.getenv('FLUX_REQUIRE_SIGNING'),
                System.getenv('ANDROID_REQUIRE_RELEASE_SIGNING'),
            ].any { it != null && it.trim().toLowerCase() in ['true', '1'] }

            def releaseSigningConfig = signingConfigs.findByName('release')
            if (releaseSigningConfig != null) {
                signingConfig releaseSigningConfig
            } else if (requireReleaseSigning) {
                throw new GradleException('[Hermes Flux] Release signing is required, but keystore.properties / ANDROID_KEYSTORE_* is missing or incomplete. Refusing to fall back to debug signing. See docs/testing/cross-platform-release-signing.md.')
            } else {
                logger.warn('[Hermes Flux] WARNING: Release keystore not configured (keystore.properties or ANDROID_KEYSTORE_* missing). Falling back to debug signing; Android will warn about unverified developer identity on install. See docs/testing/cross-platform-release-signing.md.')
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
