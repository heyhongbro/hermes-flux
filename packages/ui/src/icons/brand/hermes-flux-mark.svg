        <polygon id="hf-mark-poly-chestUpper" points="540,338 661,591 493,535" fill="url(#hf-mark-chestUpper)" />
        <polygon id="hf-mark-poly-chestLower" points="493,535 661,591 455,694" fill="url(#hf-mark-chestLower)" />
