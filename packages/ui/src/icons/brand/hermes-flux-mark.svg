      <g data-part="wing-upper">
        <polygon id="hf-mark-poly-upperWingTop" points="199,217 540,338 512,456" fill="url(#hf-mark-upperWingTop)" />
        <polygon id="hf-mark-poly-upperWingBottom" points="199,217 512,456 292,427" fill="url(#hf-mark-upperWingBottom)" />
      </g>
      <g data-part="head">
        <polygon id="hf-mark-poly-neckHead" points="597,449 693,390 745,406 729,453 661,591" fill="url(#hf-mark-neckHead)" />
      </g>
      <g data-part="beak">
        <polygon id="hf-mark-poly-beak" points="745,406 801,425 729,453" fill="url(#hf-mark-beak)" />
      </g>
      <g data-part="body">
