<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%" role="img" aria-label="Hermes Flux">
  <defs>
    <filter id="hf-mark-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="4" dy="20" stdDeviation="18" flood-color="#1A2233" flood-opacity="0.17" />
    </filter>
    <linearGradient id="hf-mark-lowerWing" x1="292" y1="427" x2="512" y2="572" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#19347A" />
      <stop offset="100%" stop-color="#10255E" />
    </linearGradient>
    <linearGradient id="hf-mark-tail" x1="270" y1="772" x2="484" y2="572" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#255CD1" />
      <stop offset="100%" stop-color="#193F96" />
    </linearGradient>
    <linearGradient id="hf-mark-upperWingTop" x1="199" y1="217" x2="540" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6538" />
      <stop offset="100%" stop-color="#EA4B20" />
    </linearGradient>
    <linearGradient id="hf-mark-upperWingBottom" x1="199" y1="217" x2="512" y2="456" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E6461D" />
      <stop offset="100%" stop-color="#CC3612" />
    </linearGradient>
    <linearGradient id="hf-mark-neckHead" x1="597" y1="449" x2="745" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7AD2A" />
      <stop offset="100%" stop-color="#FFD056" />
    </linearGradient>
    <linearGradient id="hf-mark-beak" x1="745" y1="406" x2="801" y2="435" gradientUnits="userSpaceOnUse">
