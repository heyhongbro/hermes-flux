    </linearGradient>
    <linearGradient id="hf-mark-chestUpper" x1="540" y1="338" x2="530" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFC23D" />
      <stop offset="100%" stop-color="#F5A623" />
    </linearGradient>
    <linearGradient id="hf-mark-chestLower" x1="455" y1="694" x2="661" y2="591" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EB9414" />
      <stop offset="100%" stop-color="#D97E0A" />
    </linearGradient>
  </defs>
  <g filter="url(#hf-mark-shadow)">
    <g transform="translate(-120, -116) scale(1.24)">
      <g data-part="wing-lower">
        <polygon id="hf-mark-poly-lowerWing" points="292,427 512,456 484,572" fill="url(#hf-mark-lowerWing)" />
