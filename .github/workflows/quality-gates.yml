name: Quality Gates

# 设计意图：
#   本地 pre-commit 可被 --no-verify 绕过，CI 是不可绕过的最终裁决层。
#   仅守护受保护集成分支 push（合入后兜底）与全部 pull_request（含任意 t3/*/feat/*/fix/* 与 fork PR），
#   避免功能分支既触发 push 又触发 pull_request 导致双倍 CI 账单；同时支持 workflow_dispatch 手动校验。

on:
  push:
    branches: [main, 'dev/**']
  pull_request:
    branches: [main, 'dev/**']
  workflow_dispatch:
    inputs:
      mutation_domain:
        description: '可选：手动指定运行的单个 Stryker 变异域（留空则按需检查）'
        required: false
        default: ''
        type: string

concurrency:
  group: gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gate 0-4
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 跨平台矩阵是刻意的：本项目历史上出现过「bash 钩子在 PowerShell 下完全失效」
        # 的隐性问题，只在单一 OS 上验证会让这类缺陷长期潜伏。
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          # 门禁需要与基线比对，且 PR 增量覆盖率与变更域变异测试依赖完整提交历史
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 安装口径必须与 package-lock.json 严格一致，禁止 `npm install` 的隐式改写。
      # 约束：workspace 内部依赖统一用 `*`，任何 `workspace:` 协议都会让 npm 直接失败。
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # 必须在 npm run build 之前以文件系统核验 workspace 链接，禁止提前 require 产物
      - name: Verify workspace links
        run: node scripts/gates/verify-workspace-links.mjs

      # CI workflow 自身可移植性静态检查（覆盖全文件全部 job）
      - name: Gate 0a · CI workflow 可移植性
        run: npm run gates:ci

      # 测试目标由 Node 自己枚举，绕开 ubuntu/windows shell globstar 语义差异
      - name: Verify test census (glob 与执行量自证)
        run: node scripts/gates/census-targets.mjs

      - name: Gate 0/4 · 静态门禁（架构 / 换肤 / i18n / 性能 / testAware 测试规模与性能）
        run: node scripts/gates/run.mjs

      # 存量债务清偿进度仅在 ubuntu 单侧写入 Step Summary，避免拉起额外独立 runner 重复 npm ci
      - name: 存量债务进度观测（输出至 Job Summary）
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/gates/report-debt-progress.mjs

      - name: Gate 1 · 全栈严格类型
        run: npm run typecheck

      # 单次全量构建后直接运行 `npm run census`，避免 `npm test` 内部 `pretest` 再次重复构建
      - name: Gate 1b · 全量构建
        run: npm run build

      - name: Gate 2 · 单元测试与不变量
        run: npm run census

      - name: Gate 2b · 门禁自身变异检验
        run: npm run gates:mutation

      - name: Gate 2d · 豁免敞口预算（行内豁免只降不升）
        run: npm run gates:allow

      - name: Gate 2e · 门禁自证套件（门禁本身具备杀伤力）
        run: npm run gates:self-proof

      - name: Gate 2g · 增量覆盖率拦截器自证（未覆盖代码与分支必拦截）
        run: npm run gates:coverage-proof

      - name: Gate 2h · PR 新增代码 100% 增量覆盖率
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        run: npm run coverage:new

      - name: Gate 2f · 假测试证伪器（删生产代码必须变红）
        run: npm run gates:fake-tests

      - name: Gate 3a · 不变量映射表（id 唯一、测试含 fc.assert、Markdown 与 JSON 一致）
        run: npm run gates:invariants

      - name: Gate 3 · 形式化不变量（fast-check）
        run: npm run verify:formal

      # 拆成独立 step 确保 windows pwsh 逐条结算退出码
      - name: Gate 0b · 网关契约一致性
        run: npm run contract:verify

      - name: Gate 0c · 契约调用点覆盖
        run: npm run contract:coverage

      - name: Gate 0d · 契约文档同步
        run: npm run contract:doc:check

      - name: Gate 4e · 长会话性能预算（独占 CPU）
        run: npm run test:perf

  pr-mutation:
    name: Gate 5 · PR 变更域 Stryker 变异测试
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mutation_domain != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify workspace links
        run: node scripts/gates/verify-workspace-links.mjs

      - name: Gate 5 · PR 变更域 Stryker 变异测试
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          MANUAL_MUTATION_DOMAIN: ${{ inputs.mutation_domain }}
        run: node scripts/gates/mutation-stryker-changed.mjs --ci
